name: Build Spork iOS Dylib
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ldid make git curl unzip

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build Tweak (Dylib only)
        run: |
          export THEOS=$HOME/theos
          # No Linux, o ldid já está no PATH após o apt-get install
          export TARGET_CODESIGN=ldid
          make FINALPACKAGE=1

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: Spork-Dylib
          path: .theos/obj/arm64/Spork.dylib
