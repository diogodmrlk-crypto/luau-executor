name: Build Spork iOS Dylib
on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install ldid
        run: brew install ldid

      - name: Build Tweak (Dylib only)
        run: |
          export THEOS=$HOME/theos
          export TARGET_CODESIGN=$(which ldid)
          # Usa 'make' em vez de 'make package' para não gerar .deb
          make FINALPACKAGE=1

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: Spork-Dylib
          # O caminho exato onde o Theos salva a dylib
          path: .theos/obj/arm64/Spork.dylib
