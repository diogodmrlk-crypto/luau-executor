name: Build Spork iOS Dylib
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git curl unzip

      - name: Install ldid (Linux binary)
        run: |
          # Baixa o ldid compilado para Linux x86_64
          curl -sLO https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          sudo mv ldid_linux_x86_64 /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid
          ldid -v # Verifica se instalou certo

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build Tweak
        run: |
          export THEOS=$HOME/theos
          export TARGET_CODESIGN=ldid
          make FINALPACKAGE=1

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: Spork-Dylib
          path: .theos/obj/arm64/Spork.dylib
